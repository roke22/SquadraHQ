# Pisha demo: the dashboard and one machine that runs Claude Code, in a
# single container. Everything it keeps is in ./pisha, next to this file.
#
#   cd deploy/demo
#   docker-compose up -d              # or: docker compose up -d
#   cat pisha/data/server-token     # the token that creates the first owner (also in: docker-compose logs)
#
# Then open http://localhost:7787. Only this computer can reach it.
services:
  pisha-demo:
    build:
      context: ../..
      dockerfile: deploy/demo/Dockerfile
    image: pisha-demo
    restart: unless-stopped
    ports:
      - "127.0.0.1:7787:7787"
    volumes:
      - ./pisha:/pisha
