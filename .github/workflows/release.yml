# A release, when its tag (vX.Y.Z) is pushed: the server published to npm
# (npx pisha-server) and as a container image on GitHub's registry
# (ghcr.io/roke22/pisha), both from the tagged code. See RELEASE.md.
#
# Needs, once: an npm token with rights to publish pisha-server, as the
# repository secret NPM_TOKEN; and, after the first image, the package
# ghcr.io/roke22/pisha made public in its settings on GitHub.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Nothing is published unless the release is signed (as machines require).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/release.mjs check "$GITHUB_REF_NAME"

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # (npm provenance: says which workflow and commit built it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: The tag is the package's version
        run: |
          v="$(node -p "require('./server/package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but server/package.json says $v"; exit 1; }
      - name: The package starts on its own
        run: node --test test/package.test.mjs
      - name: Publish
        working-directory: server
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and push (amd64 and arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$v" = "$(node -p "require('./server/package.json').version")" ] || { echo "tag $GITHUB_REF_NAME doesn't match server/package.json"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # (Fixed by digest: to update, change it here.)
          docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 -f server/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=$v" \
            --label "org.opencontainers.image.description=Pisha: teams of AI coding agents, a self-hosted dashboard and an inbox for your decisions" \
            -t "$image:$v" -t "$image:latest" --push .
